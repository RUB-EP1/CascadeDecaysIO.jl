name: Test
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1']
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/ReusableTest.yml
    with:
      version: ${{ matrix.version }}
      os: ${{ matrix.os }}
